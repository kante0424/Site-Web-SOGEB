# Site SOGEB : Nginx (porte d'entrée HTTPS) + application Wagtail + PostgreSQL
# Lancement : docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [interne]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
      - static:/app/staticfiles_partage
    depends_on:
      db:
        condition: service_healthy
    # Copie les fichiers statiques vers le volume partagé avec Nginx, puis démarre Gunicorn
    command: sh -c "cp -r /app/staticfiles/. /app/staticfiles_partage/ && gunicorn sogeb.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    networks: [interne]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on: [app]
    networks: [interne]

volumes:
  db_data:
  media:
  static:

networks:
  interne:
