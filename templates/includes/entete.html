{% load static wagtailcore_tags sogeb_tags %}{% accueil as racine %}{% menu_principal as menu %}
<header class="entete">
  <div class="conteneur entete__inner">
    <a class="logo" href="{% if racine %}{% pageurl racine %}{% else %}/{% endif %}" aria-label="SOGEB, retour à l'accueil">
      <picture>
        <source srcset="{% static 'img/logo-sogeb.webp' %}" type="image/webp">
        <img src="{% static 'img/logo-sogeb.png' %}" alt="Logo de la SOGEB" width="64" height="64">
      </picture>
      <span class="logo__texte"><strong>SOGEB</strong><small>Backbone National</small></span>
    </a>
    <button class="menu-bouton" type="button" aria-expanded="false" aria-controls="menu-principal">
      <span class="menu-bouton__barres" aria-hidden="true"></span><span class="sr-only">Menu</span>
    </button>
    <nav id="menu-principal" class="menu" aria-label="Navigation principale">
      <ul>
        {% for item in menu %}
          <li><a href="{% pageurl item %}"{% if page and item|est_dans:page %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
